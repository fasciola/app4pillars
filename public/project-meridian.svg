    <g transform="translate(650 0)"><rect width="300" height="190" rx="22" fill="#0d131d" stroke="#e8c37a" stroke-opacity=".22"/><circle cx="42" cy="42" r="18" fill="#e8c37a"/><text x="26" y="48" fill="#071018" font-size="16" font-weight="700">03</text><text x="28" y="104" fill="#f4f2ed" font-size="24">Expansion</text><text x="28" y="140" fill="#7f8a99" font-size="14">Visas, permits & new markets</text></g>
