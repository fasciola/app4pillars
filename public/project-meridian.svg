    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#b88a46"/><stop offset=".5" stop-color="#e8c37a"/><stop offset="1" stop-color="#8e632f"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".08" stroke="#e8c37a"><path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600M0 900h1600"/><path d="M200 0v1000M400 0v1000M600 0v1000M800 0v1000M1000 0v1000M1200 0v1000M1400 0v1000"/></g>
