<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">NOCTURE beauty website preview</title>
  <desc id="desc">A cinematic black and antique gold beauty retail website preview.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="34%" r="75%">
      <stop offset="0" stop-color="#2c2115"/>
      <stop offset="0.52" stop-color="#120f0b"/>
      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop stop-color="#8f6b2d"/>
      <stop offset="0.5" stop-color="#d9b45c"/>
      <stop offset="1" stop-color="#7b5723"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1250" cy="290" r="250" fill="#d9b45c" opacity=".08" filter="url(#blur)"/>
  <circle cx="1170" cy="265" r="165" fill="none" stroke="#d9b45c" stroke-width="1.5" opacity=".28"/>
  <rect x="76" y="68" width="1448" height="864" rx="34" fill="#0b0907" stroke="#d9b45c" stroke-opacity=".2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="128" fill="#d9b45c" font-size="22" letter-spacing="9">NOCTURE</text>
    <text x="1420" y="128" fill="#8f7d60" font-size="14" text-anchor="end" letter-spacing="4">BEAUTY AFTER DARK</text>
    <line x1="120" y1="160" x2="1480" y2="160" stroke="#d9b45c" stroke-opacity=".18"/>
    <text x="128" y="358" fill="#f2ece2" font-family="Georgia, serif" font-size="86">Beauty,</text>
    <text x="128" y="447" fill="#f2ece2" font-family="Georgia, serif" font-size="86">composed after dark.</text>
    <text x="132" y="512" fill="#9d8f7d" font-size="21" letter-spacing="1.5">FRAGRANCE  ·  COLOUR  ·  LIGHT  ·  RITUAL</text>
  </g>
  <g transform="translate(1035 360)">
    <ellipse cx="205" cy="415" rx="190" ry="34" fill="#000" opacity=".55"/>
    <rect x="118" y="90" width="174" height="310" rx="32" fill="#12100d" stroke="#d9b45c" stroke-opacity=".55" stroke-width="2"/>
    <rect x="147" y="45" width="116" height="76" rx="14" fill="url(#gold)"/>
    <rect x="162" y="18" width="86" height="42" rx="9" fill="#1a1510" stroke="#d9b45c" stroke-opacity=".5"/>
    <circle cx="205" cy="242" r="72" fill="none" stroke="#d9b45c" stroke-opacity=".35"/>
    <text x="205" y="235" text-anchor="middle" fill="#d9b45c" font-family="Georgia, serif" font-size="20" letter-spacing="4">N° 07</text>
    <text x="205" y="265" text-anchor="middle" fill="#8f7d60" font-family="Arial" font-size="10" letter-spacing="3">NIGHT BLOOM</text>
  </g>
  <rect x="128" y="610" width="248" height="66" rx="33" fill="#d9b45c"/>
  <text x="252" y="651" text-anchor="middle" fill="#17110a" font-family="Arial" font-weight="700" font-size="15" letter-spacing="2">ENTER THE HOUSE</text>
  <g opacity=".7">
    <line x1="128" y1="778" x2="850" y2="778" stroke="#d9b45c" stroke-opacity=".2"/>
    <text x="128" y="826" fill="#8f7d60" font-family="Arial" font-size="13" letter-spacing="4">A CURATED EVENING COLLECTION</text>
  </g>
